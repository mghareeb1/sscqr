<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scooter Shop Company - خدمات الفروع</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-primary: #0b0b0e;
            --bg-card: #1a1a20;
            --bg-card-hover: #22222a;
            --accent-orange: #FF6A00;
            --accent-orange-hover: #e05d00;
            --accent-gold: #FFB800;
            --accent-green: #25D366;
            --accent-purple: #7B1FA2;
            --accent-red: #E53935;
            --text-main: #FFFFFF;
            --text-muted: #9494a0;
            --border-color: #272730;
            --radius-lg: 12px;
            --radius-md: 10px;
            --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(255, 106, 0, 0.08) 0%, transparent 60%),
                linear-gradient(45deg, #111116 25%, transparent 25%), 
                linear-gradient(-45deg, #111116 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #111116 75%), 
                linear-gradient(-45deg, transparent 75%, #111116 75%);
            background-size: 100% 100%, 12px 12px, 12px 12px, 12px 12px, 12px 12px;
            background-position: 0 0, 0 0, 6px 0, 6px -6px, 0px 6px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px 12px 30px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* رأس الصفحة والشعار */
        header {
            text-align: center;
            margin-bottom: 14px;
            width: 100%;
        }

        .logo-wrapper {
            width: 95px;
            height: 95px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2.5px solid var(--accent-orange);
            box-shadow: 0 0 18px rgba(255, 106, 0, 0.28);
            overflow: hidden;
            padding: 6px;
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            color: var(--text-main);
            margin-bottom: 2px;
        }

        .brand-subtitle {
            font-size: 0.74rem;
            color: var(--accent-orange);
            font-weight: 600;
        }

        /* بطاقة الفرع النشط */
        .branch-badge-card {
            width: 100%;
            background: linear-gradient(145deg, #181820, #121217);
            border: 1px solid var(--border-color);
            border-right: 3.5px solid var(--accent-orange);
            border-radius: var(--radius-md);
            padding: 10px 14px;
            margin-bottom: 14px;
            box-shadow: var(--shadow-card);
        }

        .branch-info h2 {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .branch-info p {
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-top: 2px;
            line-height: 1.4;
        }

        /* قائمة الأزرار */
        .actions-list {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .action-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 10px 12px;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.15s ease, background 0.2s ease;
            box-shadow: var(--shadow-card);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .action-card:active {
            transform: scale(0.98);
            background: var(--bg-card-hover);
        }

        .action-card::before {
            content: '';
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: transparent;
            transition: background 0.2s ease;
        }

        .action-card.maps:hover::before { background: var(--accent-gold); }
        .action-card.whatsapp:hover::before { background: var(--accent-green); }
        .action-card.vcard:hover::before { background: var(--accent-orange); }
        .action-card.instapay:hover::before { background: var(--accent-purple); }
        .action-card.complaints:hover::before { background: var(--accent-red); }

        .action-content {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .icon-box {
            width: 38px;
            height: 38px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .icon-box svg {
            width: 19px;
            height: 19px;
            fill: currentColor;
        }

        .icon-maps { background: rgba(255, 184, 0, 0.12); color: var(--accent-gold); }
        .icon-whatsapp { background: rgba(37, 211, 102, 0.12); color: var(--accent-green); }
        .icon-vcard { background: rgba(255, 106, 0, 0.12); color: var(--accent-orange); }
        .icon-instapay { background: rgba(123, 31, 162, 0.15); color: #BA68C8; }
        .icon-complaints { background: rgba(229, 57, 53, 0.12); color: var(--accent-red); }

        .action-text h3 {
            font-size: 0.86rem;
            font-weight: 700;
            margin-bottom: 1px;
        }

        .action-text p {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .arrow-icon {
            color: var(--text-muted);
            opacity: 0.5;
            display: flex;
            align-items: center;
        }

        .arrow-icon svg {
            width: 15px;
            height: 15px;
            fill: currentColor;
        }

        /* نافذة إنستاباي */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 14px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 36
